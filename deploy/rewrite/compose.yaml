name: ${COMPOSE_PROJECT_NAME:-spina-bifida}

x-backend-environment: &backend-environment
  APP_CONFIG_FILE: /config/app.yaml

x-backend-volumes: &backend-volumes
  - type: bind
    source: ${APP_CONFIG_PATH:-./config/app.yaml}
    target: /config/app.yaml
    read_only: true
  - type: volume
    source: db
    target: /data/db
  - type: volume
    source: jobs
    target: /data/jobs
  - type: volume
    source: feedback
    target: /data/feedback
  - type: volume
    source: logs
    target: /data/logs
  - type: volume
    source: backups
    target: /data/backups

x-backend-common: &backend-common
  image: ${BACKEND_CPU_IMAGE:-spina-bifida-backend:0.1.0-cpu}
  build:
    context: ../../apps/backend
    target: runtime-cpu
    args:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BUILDKIT_SYNTAX: ${BUILD_DOCKERFILE_FRONTEND:-docker/dockerfile:1.7}
      PYTHON_IMAGE: ${BUILD_PYTHON_IMAGE:-python:3.12-slim-bookworm}
      DEBIAN_MIRROR: ${BUILD_DEBIAN_MIRROR:-http://deb.debian.org/debian}
      DEBIAN_SECURITY_MIRROR: ${BUILD_DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
      TORCH_CPU_INDEX_URL: ${BUILD_TORCH_CPU_INDEX_URL-https://download.pytorch.org/whl/cpu}
      PIP_FIND_LINKS: ${BUILD_PIP_FIND_LINKS:-}
  env_file:
    - ${APP_ENV_FILE:-.env}
    - path: ${POSTBOX_ENV_FILE:-./.postbox.env}
      required: false
  environment: *backend-environment
  volumes: *backend-volumes
  networks: [application]
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  stop_grace_period: 30s

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.3}
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=false
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic/active.yaml
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-ops@example.invalid}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${TRAEFIK_CERTS_DIR:-/etc/spina-bifida/tls}
        target: /certs
        read_only: true
      - type: bind
        source: ${TRAEFIK_DYNAMIC_CONFIG:-./traefik/http.yaml}
        target: /etc/traefik/dynamic/active.yaml
        read_only: true
      - type: volume
        source: letsencrypt
        target: /letsencrypt
    networks: [application]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-spina-bifida-frontend:0.1.0}
    build:
      context: ../../apps/frontend
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILDKIT_SYNTAX: ${BUILD_DOCKERFILE_FRONTEND:-docker/dockerfile:1.7}
        NODE_IMAGE: ${BUILD_NODE_IMAGE:-node:22-bookworm-slim}
        NGINX_IMAGE: ${BUILD_NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine}
        NPM_REGISTRY: ${BUILD_NPM_REGISTRY:-https://registry.npmjs.org}
    networks: [application]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    <<: *backend-common
    command:
      - python
      - -c
      - from spina_bifida import create_app; from spina_bifida.extensions import upgrade_database; upgrade_database(create_app())
    restart: "no"

  api:
    <<: *backend-common
    command: [gunicorn, --workers, "1", --bind, 0.0.0.0:8000, --access-logfile, "-", spina_bifida:create_app()]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend-common
    command: [python, -m, spina_bifida.queue.worker]
    volumes:
      - type: bind
        source: ${APP_CONFIG_PATH:-./config/app.yaml}
        target: /config/app.yaml
        read_only: true
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /models
        read_only: true
      - type: volume
        source: db
        target: /data/db
      - type: volume
        source: jobs
        target: /data/jobs
      - type: volume
        source: feedback
        target: /data/feedback
      - type: volume
        source: logs
        target: /data/logs
      - type: volume
        source: backups
        target: /data/backups
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,socket,time; p=f'/data/db/worker-heartbeat-{socket.gethostname()}.json'; assert os.path.exists(p) and time.time()-os.path.getmtime(p)<30
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 120s

networks:
  application:
    driver: bridge

volumes:
  db:
  jobs:
  feedback:
  logs:
  backups:
  letsencrypt:
