[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "spina-bifida-backend"
version = "0.1.0"
description = "Local Flask API and inference worker for the Spina Bifida research service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "boto3>=1.40,<2",
  "concurrent-log-handler>=0.9,<1",
  "Flask>=3.1,<3.2",
  "Flask-Limiter>=4,<5",
  "Flask-Login>=0.6,<0.7",
  "Flask-SQLAlchemy>=3.1,<3.2",
  "Flask-WTF>=1.2,<1.3",
  "gunicorn>=23,<24",
  "Pillow>=11,<13",
  "pydantic>=2.11,<3",
  "python-json-logger>=3,<5",
  "PyYAML>=6,<7",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["ml: exercises real medical model weights and inference"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spina_bifida"]
